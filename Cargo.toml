[package]
name = "slint_orbclient"
version = "0.1.0"
edition = "2021"
authors = ["Florian Blasius <co_sl@tutanota.com>"]
license = "MIT"
description = "Slint platform support for Redox"
repository = "https://gitlab.redox-os.org/redox-os/slint_orbclient"
readme = "README.md"

[dependencies]
slint =  { version = "0.3.2", default-features = false, features = ["compat-0-3-0", "unsafe-single-threaded", "libm"] }
orbclient = { version = "0.3" }
once_cell = "1.16.0"
instant = "0.1"